name: Build SWK ONE Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SWK Properties OS + SWK ONE Android
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies & sync native Android assets
        run: |
          npm ci
          npm run android:sync

      - name: Setup Gradle & Build SWK ONE Android APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Assemble Debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload SWK ONE Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swk-one-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
