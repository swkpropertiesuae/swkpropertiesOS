<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1714">
<title>You are offline – SWK OS</title>
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1714; color: #e8efe9; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 20px; }
  h1 { font-size: 22px; margin: 20px 0 8px; }
  p { margin: 0 0 20px; color: #a9b8ae; }
  a { display: inline-block; background: #1fcf90; color: #06241a; text-decoration: none; font-weight: 600; padding: 12px 22px; border-radius: 10px; }
  a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @media (prefers-color-scheme: light) { body { background: #f4f7f5; color: #14201a; } p { color: #4a5a50; } }
</style>
</head>
<body>
<main>
  <img src="/app-icon-192.png" alt="SWK Properties">
  <h1>You are offline</h1>
  <p>SWK OS needs a connection to show your data. Business data is never stored on this device while you are offline. Check your connection, then try again.</p>
  <a href="/">Try again</a>
</main>
</body>
</html>
